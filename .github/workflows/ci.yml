name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Setup SpacetimeDB
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --root-dir "$RUNNER_TEMP/spacetime" -y
          echo "$RUNNER_TEMP/spacetime" >> "$GITHUB_PATH"
          echo "SPACETIME_ROOT=$RUNNER_TEMP/spacetime" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Validate generated bindings
        run: |
          bun run generate
          git diff --exit-code src/module_bindings

      - name: Run biome check
        run: bun run lint

      - name: Run TypeScript check
        run: bun run tsc

      - name: Build client
        run: bun run build
